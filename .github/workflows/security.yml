name: Pipeline DevSecOps Complet

on:
  push:
    # Se lance à chaque modification sur la branche principale
    branches: [ "main" ]
  schedule:
    # Scan de sécurité automatique tous les jours à 2h00 du matin
    - cron: '0 2 * * *'

jobs:
  pipeline_securite:
    runs-on: ubuntu-latest

    steps:
      # --- ÉTAPE 1 : Préparation ---
      - name: Récupération du code source
        uses: actions/checkout@v4

      # --- ÉTAPE 2 : Chasse aux secrets ---
      - name: Scanner les mots de passe et clés API (Gitleaks)
        run: gitleaks detect --source . -v

      # --- ÉTAPE 3 : Analyse statique du code (SAST) ---
      - name: Scanner le code source (Semgrep)
        # On inclut les règles pour JavaScript, React, et Python pour couvrir tout ton projet
        run: semgrep ci --config "p/javascript" --config "p/react" --config "p/python"

      # --- ÉTAPE 4 : Analyse des dépendances natives (JS) ---
      - name: Vérifier les vulnérabilités npm (Natif)
        run: npm audit --audit-level=high
        # On ajoute ceci pour que npm audit prévienne sans bloquer brutalement le pipeline
        continue-on-error: true 

      # --- ÉTAPE 5 : Analyse approfondie des bibliothèques (SCA) ---
      - name: Scanner les failles mondiales connues (Trivy)
        run: trivy fs --severity HIGH,CRITICAL --ignore-unfixed .

      # --- ÉTAPE 6 : Déploiement Continu (CD) ---
      - name: Déployer sur Render en toute sécurité
        # Cette condition garantit que Render n'est appelé QUE si toutes les étapes au-dessus sont vertes
        if: success() 
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}