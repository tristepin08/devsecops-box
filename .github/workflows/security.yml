name: Mon pipeline de securite

on:
  push:
    branches:
      - main

jobs:
  test-de-securite:
    runs-on: ubuntu-latest
    steps:
    - name: Telecharger le code sur le serveur
      uses: actions/checkout@v4

    - name: Lancer le scanner Semgrep
      uses: returntocorp/semgrep-action@v1
      with:
        config: p/ci