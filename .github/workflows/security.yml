name: Pipeline DevSecOps Complet (Scan + Build + Push)

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  packages: write

jobs:
  pipeline_securite:
    runs-on: ubuntu-latest

    steps:
      # --- ÉTAPE 1 : Préparation ---
      - name: Récupération du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- ÉTAPE 2 : Gitleaks (Corrigé pour toujours créer un JSON) ---
      - name: Scanner les secrets (Gitleaks)
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
          ./gitleaks detect --report-format json --report-path gitleaks-report.json || echo "[]" > gitleaks-report.json
        continue-on-error: true

      # --- ÉTAPE 3 : Semgrep (Corrigé pour toujours créer un JSON) ---
      - name: Scanner le code source (Semgrep)
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto --json -o semgrep-report.json || echo "{}" > semgrep-report.json
        continue-on-error: true

      # --- ÉTAPE 4 : Analyse npm ---
      - name: Vérifier les vulnérabilités npm (Natif)
        run: npm audit --audit-level=high
        continue-on-error: true

      # --- ÉTAPE 5 : Le Triple Scan Trivy (Détails + JSON) ---
      - name: Scan des dépendances (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'HIGH,CRITICAL'

      - name: Scan de la config Docker (IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          format: 'table'
          severity: 'HIGH,CRITICAL'

      - name: Scan de l'image Linux (Génération du JSON)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'node:alpine'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true

      # --- ÉTAPE 6 : Connexion au Registre GitHub (GHCR) ---
      - name: Connexion au Registre GitHub Packages
        if: success()
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- ÉTAPE 7 : Build et Push de l'image ---
      - name: Build et Push de l'image sécurisée
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest

      # --- ÉTAPE 8 : Envoi groupé vers DefectDojo ---
      - name: Envoyer les rapports vers DefectDojo
        if: always()
        run: |
          # Envoi Trivy
          curl -X POST "https://https://fast-monkeys-glow.loca.lt/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Trivy Scan" \
            -F "file=@trivy-report.json" \
            -F "engagement=1"
          
          # Envoi Semgrep
          curl -X POST "https://https://fast-monkeys-glow.loca.lt/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Semgrep JSON Report" \
            -F "file=@semgrep-report.json" \
            -F "engagement=1"
          
          # Envoi Gitleaks
          curl -X POST "https://https://fast-monkeys-glow.loca.lt/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Gitleaks Scan" \
            -F "file=@gitleaks-report.json" \
            -F "engagement=1" 

      # --- ÉTAPE 9 : Déploiement sur Render (Ta ligne originale) ---
      - name: Déployer sur Render en toute sécurité
        if: success()
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}