name: Mon pipeline de securite

on:
  push:
    branches:
      - main

jobs:
  test-de-securite:
    runs-on: ubuntu-latest
    steps:
    - name: Telecharger le code sur le serveur
      uses: actions/checkout@v4

    - name: Lancer le scanner Semgrep
      uses: returntocorp/semgrep-action@v1
      with:
        config: p/python
  scan-de-mot-de-passe:
    runs-on: ubuntu-latest
    steps:
      - name: Telecharger l'historique du code
        uses: actions/checkout@v4
        with :
          fetch-depth: 0

      - name: lancer le traqueur Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  scan-conteneur:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Construire la boîte (Image Docker)
        run: docker build -t mon-app-secu .

      - name: Scanner la boîte avec Trivy aux rayons X
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mon-app-secu'
          format: 'table'
          # On demande à Trivy de faire exploser le pipeline (exit-code 1) 
          # SEULEMENT s'il trouve des failles CRITIQUES
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
  deploy:
    needs: [test-de-securite, scan-de-mot-de-passe, scan-conteneur]
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le déploiement sur Render
        run: |
          curl -X POST "https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_API_KEYS }}"