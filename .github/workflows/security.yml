name: Pipeline DevSecOps Complet (Scan + Build + Push)

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  packages: write

jobs:
  pipeline_securite:
    runs-on: ubuntu-latest

    steps:
      # --- ÉTAPE 1 : Préparation ---
      - name: Récupération du code source
        uses: actions/checkout@v4

      # --- ÉTAPE 2 : Chasse aux secrets (Gitleaks) ---
      - name: Scanner les mots de passe et clés API (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # On génère le rapport JSON pour DefectDojo
          args: detect --report-format json --report-path gitleaks-report.json
        continue-on-error: true

      # --- ÉTAPE 3 : Analyse statique du code (Semgrep) ---
      - name: Scanner le code source multilingue (Semgrep)
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto --json -o semgrep-report.json
        continue-on-error: true

      # --- ÉTAPE 4 : Analyse des dépendances (Natif) ---
      - name: Vérifier les vulnérabilités npm (Natif)
        run: npm audit --audit-level=high
        continue-on-error: true

      # --- ÉTAPE 5 : Le Triple Scan de Sécurité (Trivy) ---
      - name: Scan des dépendances (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'

      - name: Scan de la config Docker (IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Scan de l'image Linux (JSON pour DefectDojo)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'node:alpine'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true

      # --- ÉTAPE 6 : Connexion au Registre GitHub (GHCR) ---
      - name: Connexion au Registre GitHub Packages
        if: success()
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- ÉTAPE 7 : Construction et Envoi de l'image ---
      - name: Build et Push de l'image sécurisée
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest

      # --- ÉTAPE 8 : Envoi des rapports vers DefectDojo ---
      - name: Envoyer le rapport Trivy vers DefectDojo
        if: always()
        run: |
          curl -X POST "https://kind-peaches-report.loca.lt/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Trivy Scan" \
            -F "file=@trivy-report.json" \
            -F "engagement=1"

      - name: Envoyer le rapport Semgrep vers DefectDojo
        if: always()
        run: |
          curl -X POST "https://kind-peaches-report.loca.lt/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Semgrep JSON Report" \
            -F "file=@semgrep-report.json" \
            -F "engagement=1"

      - name: Envoyer le rapport Gitleaks vers DefectDojo
        if: always()
        run: |
          curl -X POST "https://kind-peaches-report.loca.lt/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Gitleaks Scan" \
            -F "file=@gitleaks-report.json" \
            -F "engagement=1"

      # --- ÉTAPE 9 : Déploiement sur Render ---
      - name: Déployer sur Render en toute sécurité
        if: success()
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}