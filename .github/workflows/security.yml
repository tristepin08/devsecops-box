name: Pipeline DevSecOps (Scan + Build + Push + Deploy)

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  packages: write

jobs:
  pipeline_securite:
    runs-on: ubuntu-latest

    steps:
      # --- ÉTAPE 1 : Préparation ---
      - name: Récupération du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- ÉTAPE 2 : Chasse aux secrets (Gitleaks) ---
      - name: Scanner les mots de passe et clés API (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # --- ÉTAPE 3 : Analyse statique du code (Semgrep) ---
      - name: Scanner le code source multilingue (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
        continue-on-error: true

      # --- ÉTAPE 4 : Analyse des dépendances (Natif) ---
      - name: Vérifier les vulnérabilités npm (Natif)
        run: npm audit --audit-level=high
        continue-on-error: true

      # --- ÉTAPE 5 : Le Triple Scan de Sécurité (Trivy) ---
      - name: Scan des dépendances (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true

      - name: Scan de la config Docker (IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          format: 'table'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true

      - name: Scan de l'image Linux
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'node:alpine'
          format: 'table'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true

      # --- ÉTAPE 6 : Connexion au Registre GitHub (GHCR) ---
      - name: Connexion au Registre GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- ÉTAPE 7 : Build et Push de l'image ---
      - name: Build et Push de l'image sécurisée
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest

      # --- ÉTAPE 8 : Déploiement sur Render ---
      - name: Déployer sur Render
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}